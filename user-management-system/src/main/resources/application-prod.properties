# ===================================================
# application-prod.properties
# Production profile — activated by SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST be provided via environment variables
# ===================================================

# ===========================
# MySQL Database Configuration
# ===========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# Connection Pool (HikariCP)
# ===========================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===========================
# JPA / Hibernate
# ===========================
# Use 'validate' in prod — never auto-alter schema in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===========================
# Logging — Production Level
# ===========================
logging.level.root=WARN
logging.level.com.usermanagement=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# ===========================
# Actuator — Minimal Exposure
# ===========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===========================
# H2 Console — Disabled in Prod
# ===========================
spring.h2.console.enabled=false
